# Names and descriptions live in strings.json / translations under "services".
send_command:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: revox_studioart
    ascii:
      required: false
      example: "volume 40"
      selector:
        text:
    raw:
      required: false
      example: "SETLEFT"
      selector:
        text:
    bin_group:
      required: false
      example: 2
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    bin_cmd:
      required: false
      example: 91
      selector:
        number:
          min: 0
          max: 255
          mode: box
    bin_value:
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

unpair_speaker:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: revox_studioart
    serial:
      required: false
      example: "SAAD11958"
      selector:
        text:
