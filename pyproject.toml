[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "SIM105",  # contextlib.suppress: try/except is fine where used deliberately
    "RUF012",  # HA's _attr_* class attributes are conventionally mutable
]

[tool.ruff.lint.per-file-ignores]
# the standalone CLI is deliberately dependency-free and quick-and-dirty
"tools/revox_cli.py" = ["E722", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
